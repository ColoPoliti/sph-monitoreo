# Nginx del contenedor "monitor". El HTTPS lo resuelve el proxy de adelante (Traefik).

# Para el WebSocket de MQTT
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Con los destinos en variables, Nginx arranca aunque
    # la API o el broker estén caídos, y sigue funcionando si se recrean.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API PHP de lotes: /api/lotes.php -> http://saphirus-api/lotes.php
    location /api/ {
        set $api_host saphirus-api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_host:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Broker MQTT por WebSocket: /mqtt -> ws://saphirus-mosquitto:9001
    location = /mqtt {
        set $mqtt_host saphirus-mosquitto;
        proxy_pass http://$mqtt_host:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # La configuración se edita en el servidor: nunca en caché
    location = /config.env {
        add_header Cache-Control "no-store";
    }

    # Rutas de la app (/historial, /lotes/13): devolver index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
